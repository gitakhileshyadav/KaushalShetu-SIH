<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Central Emblem Container -->
  <g filter="url(#glow)" transform="translate(0, 0)">
    <!-- Outer Cooperative Ring -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-dasharray="16 10" />
    <circle cx="256" cy="256" r="126" fill="#0f172a" fill-opacity="0.85" stroke="rgba(255,255,255,0.15)" stroke-width="3" />

    <!-- Building / Apex Pillar Motif -->
    <!-- Base -->
    <rect x="180" y="324" width="152" height="18" rx="4" fill="url(#goldGrad)" />
    <rect x="194" y="310" width="124" height="10" rx="2" fill="#e2e8f0" />

    <!-- Pillars (4 pillars) -->
    <rect x="204" y="228" width="14" height="76" rx="3" fill="#f8fafc" />
    <rect x="234" y="228" width="14" height="76" rx="3" fill="#f8fafc" />
    <rect x="264" y="228" width="14" height="76" rx="3" fill="#f8fafc" />
    <rect x="294" y="228" width="14" height="76" rx="3" fill="#f8fafc" />

    <!-- Pediment / Roof Triangle -->
    <polygon points="256,156 176,218 336,218" fill="url(#goldGrad)" />
    <polygon points="256,170 196,214 316,214" fill="#0f172a" fill-opacity="0.5" />

    <!-- Educational Graduation Cap Floating Star -->
    <circle cx="256" cy="198" r="10" fill="#38bdf8" />

    <!-- Cooperative Leaves / Laurel Base -->
    <path d="M164 286 C152 250 162 216 172 200 C172 220 178 248 194 266 Z" fill="#34d399" />
    <path d="M348 286 C360 250 350 216 340 200 C340 220 334 248 318 266 Z" fill="#34d399" />
  </g>

  <!-- Subtitle Badge -->
  <rect x="186" y="380" width="140" height="28" rx="14" fill="url(#goldGrad)" />
  <text x="256" y="399" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="2">NCCT</text>
</svg>
